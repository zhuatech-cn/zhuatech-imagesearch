services:
  api:
    build: ./backend
    environment:
      ZHUATECH_IMAGE_SEARCH_PROVIDER: ${ZHUATECH_IMAGE_SEARCH_PROVIDER:-local}
      ZHUATECH_IMAGE_SEARCH_BASE_URL: ${ZHUATECH_IMAGE_SEARCH_BASE_URL:-}
      ZHUATECH_IMAGE_SEARCH_MODEL: ${ZHUATECH_IMAGE_SEARCH_MODEL:-vision-embedding-provider-model}
      ZHUATECH_IMAGE_SEARCH_API_KEY: ${ZHUATECH_IMAGE_SEARCH_API_KEY:-}
    ports: ["8080:8080"]
  web:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8088:80"]
